<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-label="Two rows share the identical trigger: a control throws, times out, or is never reached, so no verdict exists. In both rows the request proceeds anyway. In the first row, silent fail open, nothing is recorded, no alert fires, and the metric stays unchanged, so the status readout, shown in brick, reports healthy, indistinguishable from a correct pass. In the second row, recorded and surfaced, the identical failure is written to the record, triggers an alert, and flips the metric, so the status readout reports degraded instead. The only difference between the two rows is whether the failure was written down.">
<rect width="880" height="540" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">The control fails. Only one row says so.</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">The failure below is identical in both rows. What differs is only what gets written down.</text>
<line x1="0" y1="64" x2="880" y2="64" stroke="#1a1a1a" stroke-width="1"/>

<!-- shared trigger band -->
<rect x="0" y="72" width="880" height="32" fill="#fafaf8"/>
<text x="440" y="92" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="12" font-style="italic" fill="#1a1a1a">Same trigger for both rows below: the control throws, times out, or is never reached. No verdict exists.</text>
<line x1="0" y1="104" x2="880" y2="104" stroke="#e8e8e8" stroke-width="1"/>

<!-- column headers -->
<text x="110" y="122" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" fill="#6b6b6b">CONTROL</text>
<text x="330" y="122" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" fill="#6b6b6b">ACTION</text>
<text x="560" y="122" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" fill="#6b6b6b">WHAT GETS WRITTEN DOWN</text>
<text x="780" y="122" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" fill="#6b6b6b">STATUS READOUT</text>
<line x1="0" y1="130" x2="880" y2="130" stroke="#1a1a1a" stroke-width="1"/>

<!-- ROW A: SILENT FAIL OPEN -->
<rect x="0" y="138" width="880" height="140" fill="#fafaf8"/>
<text x="24" y="170" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#1a1a1a">1</text>
<text x="46" y="170" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">SILENT FAIL OPEN</text>
<text x="46" y="189" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#6b6b6b">nothing downstream can tell this happened</text>

<circle cx="110" cy="225" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="110" y="205" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="9.5" font-style="italic" fill="#6b6b6b">fails</text>
<text x="110" y="248" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">control</text>

<line x1="117" y1="225" x2="269" y2="225" stroke="#1a1a1a" stroke-width="1.3"/>

<circle cx="330" cy="225" r="7" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="330" y="205" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="9.5" font-style="italic" fill="#6b6b6b">proceeds</text>
<text x="330" y="248" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">request</text>

<line x1="337" y1="225" x2="484" y2="225" stroke="#1a1a1a" stroke-width="1.3"/>

<rect x="485" y="193" width="150" height="64" fill="#fafaf8" stroke="#b0b0b0" stroke-width="1.1" stroke-dasharray="3,3"/>
<text x="560" y="212" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6b6b6b">record: none</text>
<text x="560" y="228" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6b6b6b">alert: none</text>
<text x="560" y="244" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6b6b6b">metric: unchanged</text>

<line x1="635" y1="225" x2="704" y2="225" stroke="#1a1a1a" stroke-width="1.3"/>

<rect x="705" y="185" width="150" height="80" rx="4" fill="#9b4a3f" stroke="#9b4a3f"/>
<text x="780" y="220" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#fafaf8">HEALTHY</text>
<text x="780" y="240" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#fafaf8">same as a correct pass</text>

<line x1="0" y1="278" x2="880" y2="278" stroke="#e8e8e8" stroke-width="1"/>

<!-- ROW B: RECORDED AND SURFACED -->
<text x="24" y="318" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#1a1a1a">2</text>
<text x="46" y="318" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" font-weight="600" fill="#1a1a1a">RECORDED AND SURFACED</text>
<text x="46" y="337" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#6b6b6b">the identical failure, made visible</text>

<circle cx="110" cy="373" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="110" y="353" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="9.5" font-style="italic" fill="#6b6b6b">fails</text>
<text x="110" y="396" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">control</text>

<line x1="117" y1="373" x2="269" y2="373" stroke="#1a1a1a" stroke-width="1.3"/>

<circle cx="330" cy="373" r="7" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="330" y="353" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="9.5" font-style="italic" fill="#6b6b6b">proceeds, marked</text>
<text x="330" y="396" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">request</text>

<line x1="337" y1="373" x2="484" y2="373" stroke="#1a1a1a" stroke-width="1.3"/>

<rect x="485" y="341" width="150" height="64" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="560" y="360" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">record: written</text>
<text x="560" y="376" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">alert: fires</text>
<text x="560" y="392" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">metric: flips</text>

<line x1="635" y1="373" x2="704" y2="373" stroke="#1a1a1a" stroke-width="1.3"/>

<rect x="705" y="333" width="150" height="80" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="780" y="368" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#1a1a1a">DEGRADED</text>
<text x="780" y="388" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">distinguishable from a pass</text>

<line x1="0" y1="426" x2="880" y2="426" stroke="#1a1a1a" stroke-width="1"/>

<!-- legend -->
<circle cx="28" cy="450" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="46" y="454" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">the control failed, identically in both rows</text>

<circle cx="330" cy="450" r="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="348" y="454" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">the request proceeded, identically in both rows</text>

<rect x="622" y="445" width="16" height="10" fill="#9b4a3f"/>
<text x="644" y="454" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">wrong: reports healthy anyway</text>

<line x1="0" y1="474" x2="880" y2="474" stroke="#e8e8e8" stroke-width="1"/>

<text x="0" y="496" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">The control fails the same way in both rows. The request proceeds the same way in both rows.</text>
<text x="0" y="516" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#6b6b6b">A status that cannot tell a working control apart from a missing one has stopped measuring the control at all.</text>
</svg>
