<text x="28" y="230" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9b4a3f" text-anchor="start" font-weight="400" xml:space="preserve">A drill plants one fault and walks it down every link. Each link has to hold.</text>
