<rect x="307" y="56" width="118" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="1"/>
<text x="366.0" y="82.0" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="500" xml:space="preserve">PRESERVE</text>
<text x="366.0" y="97.0" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400" xml:space="preserve">logs, versions</text>
<rect x="455" y="56" width="118" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="1"/>
<text x="514.0" y="82.0" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="500" xml:space="preserve">TELL</text>
