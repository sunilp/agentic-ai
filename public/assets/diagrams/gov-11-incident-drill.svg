<text x="662.0" y="82.0" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="500" xml:space="preserve">FIX</text>
<text x="662.0" y="97.0" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400" xml:space="preserve">test or control</text>
<rect x="751" y="56" width="118" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="1"/>
<text x="810.0" y="82.0" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="500" xml:space="preserve">RESTART</text>
