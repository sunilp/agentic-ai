<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 252" role="img" aria-label="The incident path a drill walks: detect, stop, preserve, tell, fix, restart, then back to what you watch. Under each link, what the drill has to prove: acknowledged inside the clock, the stop in effect within 15 minutes, evidence pulled within the hour, the right people told in order, a change that sticks, and a restart lifted by name and recorded."><rect width="880" height="252" fill="#fff"/>
<rect x="11" y="56" width="118" height="56" fill="#fff" stroke="#1a1a1a" stroke-width="1"/>
<text x="70.0" y="82.0" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="500" xml:space="preserve">DETECT</text>
<text x="70.0" y="97.0" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400" xml:space="preserve">the real route</text>
<rect x="159" y="56" width="118" height="56" fill="#f5ece9" stroke="#9b4a3f" stroke-width="1.5"/>
<text x="218.0" y="82.0" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#9b4a3f" text-anchor="middle" font-weight="500" xml:space="preserve">STOP</text>
