<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-label="Two rows trace the same delete_all call. Row A: a system prompt sits beside the loop, the call executes, and the database is deleted. Row B: a capability gate sits on the loop, the identical call is refused before it runs, and the database stays intact.">
<defs>
  <marker id="arrInk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1a1a1a"/></marker>
  <marker id="arrBrick" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#9b4a3f"/></marker>
</defs>
<rect width="880" height="480" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">The instruction bends. The gate does not.</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">Same model, same task, same delete_all call. What differs is whether the check sits beside the loop or on it.</text>
<line x1="0" y1="76" x2="880" y2="76" stroke="#1a1a1a" stroke-width="1"/>

<!-- ROW A: system prompt only, the marked / failure row -->
<rect x="0" y="88" width="3" height="140" fill="#9b4a3f"/>
<text x="20" y="112" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#9b4a3f">A</text>
<text x="42" y="112" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#9b4a3f">SYSTEM PROMPT ONLY</text>
<text x="42" y="130" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#9b4a3f">the instruction sits beside the loop, not on it</text>

<!-- the prompt itself: a dashed aside, not on the call path -->
<rect x="470" y="90" width="272" height="42" rx="3" fill="#fafaf8" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="483" y="106" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#1a1a1a">system prompt, read as context:</text>
<text x="483" y="122" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#1a1a1a">"never delete without approval"</text>
<line x1="483" y1="134" x2="483" y2="158" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3,3"/>
<circle cx="483" cy="158" r="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.2"/>

<!-- trace: read_rows -> delete_all -> EXECUTED -> DB: DELETED -->
<rect x="300" y="160" width="100" height="34" rx="4" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="350" y="181" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">read_rows</text>

<line x1="400" y1="177" x2="424" y2="177" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrInk)"/>

<rect x="428" y="160" width="110" height="34" rx="4" fill="#fafaf8" stroke="#9b4a3f" stroke-width="1.6"/>
<text x="483" y="181" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">delete_all</text>

<line x1="538" y1="177" x2="562" y2="177" stroke="#9b4a3f" stroke-width="1.4" marker-end="url(#arrBrick)"/>

<rect x="566" y="160" width="102" height="34" rx="4" fill="#9b4a3f" stroke="#9b4a3f"/>
<text x="617" y="181" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#fafaf8">EXECUTED</text>

<line x1="668" y1="177" x2="692" y2="177" stroke="#9b4a3f" stroke-width="1.4" marker-end="url(#arrBrick)"/>

<rect x="696" y="160" width="146" height="34" rx="4" fill="#9b4a3f" stroke="#9b4a3f"/>
<text x="769" y="181" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#fafaf8">DB: DELETED</text>

<text x="300" y="222" font-family="Georgia,'EB Garamond',serif" font-size="11.5" font-style="italic" fill="#9b4a3f">no check stood on the path, so the call ran, and the prompt was only ever advice.</text>

<line x1="0" y1="240" x2="880" y2="240" stroke="#e8e8e8" stroke-width="1"/>

<!-- ROW B: capability gate, the baseline / holding row -->
<text x="20" y="276" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#1a1a1a">B</text>
<text x="42" y="276" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">CAPABILITY GATE</text>
<text x="42" y="294" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#6b6b6b">the check sits on the loop, at the call itself</text>

<!-- trace: read_rows -> delete_all -> [gate] -| BLOCKED, dashed to DB: intact -->
<rect x="300" y="324" width="100" height="34" rx="4" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="350" y="345" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">read_rows</text>

<line x1="400" y1="341" x2="424" y2="341" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arrInk)"/>

<rect x="428" y="324" width="110" height="34" rx="4" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="483" y="345" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">delete_all</text>

<!-- the gate: a barrier drawn on the path itself -->
<line x1="538" y1="341" x2="548" y2="341" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="554" y1="325" x2="554" y2="357" stroke="#1a1a1a" stroke-width="2.4"/>
<line x1="561" y1="325" x2="561" y2="357" stroke="#1a1a1a" stroke-width="2.4"/>
<text x="557" y="316" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" letter-spacing="0.4" fill="#1a1a1a">GATE</text>
<text x="557" y="371" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">no approval:</text>
<text x="557" y="383" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">refused</text>

<rect x="566" y="324" width="102" height="34" rx="4" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,3"/>
<text x="617" y="345" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6b6b6b">BLOCKED</text>

<line x1="668" y1="341" x2="692" y2="341" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="3,3"/>

<rect x="696" y="324" width="146" height="34" rx="4" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="769" y="345" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#1a1a1a">DB: intact</text>

<text x="300" y="402" font-family="Georgia,'EB Garamond',serif" font-size="11.5" font-style="italic" fill="#6b6b6b">the gate never reads the reason for the call. It reads whether an approval exists.</text>

<line x1="0" y1="420" x2="880" y2="420" stroke="#1a1a1a" stroke-width="1"/>

<rect x="20" y="430" width="14" height="10" fill="#9b4a3f"/>
<text x="40" y="439" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">enforcement inside the model's own context: argued past</text>
<rect x="470" y="430" width="14" height="10" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="490" y="439" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">enforcement outside it, at the call: holds regardless</text>

<text x="0" y="462" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">Same model, same instruction, same delete_all call. The difference is not what the agent believed.</text>
</svg>
