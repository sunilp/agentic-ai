<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-label="Two five-step chains laid side by side. In the top chain, each step is checked only against the step before it: the chain drifts steadily away from the original task while every local check still passes, ending at step five in a wrong answer marked in brick. In the bottom chain, each step is checked against the original task itself: a drift attempt at step three is caught and corrected, and the chain stays anchored to the task through all five steps.">
<rect width="880" height="600" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">What the verifier checks against decides what a chain gets away with</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">The same five-step chain, the same drift attempt at step 3. Only the anchor of the check changes.</text>
<line x1="0" y1="70" x2="880" y2="70" stroke="#1a1a1a" stroke-width="1"/>

<!-- LANE A: checked against the step before it -->
<text x="24" y="94" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.2" fill="#1a1a1a">CHECKED AGAINST THE STEP BEFORE IT</text>

<line x1="110" y1="250" x2="810" y2="250" stroke="#6b6b6b" stroke-width="1.1" stroke-dasharray="4,4"/>
<text x="40" y="254" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#6b6b6b">TASK</text>

<!-- connecting line, hop 1-4 in ink -->
<polyline points="150,244 290,228 430,200 570,172" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<!-- final hop into the marked node, ink line still (the check passed here too) -->
<polyline points="570,172 710,140" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- local-check ticks at each join -->
<text x="220" y="230" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">✓</text>
<text x="360" y="208" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">✓</text>
<text x="500" y="180" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">✓</text>
<text x="640" y="150" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">✓</text>

<!-- hop labels above each node -->
<text x="150" y="222" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">1</text>
<text x="290" y="206" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">2</text>
<text x="430" y="178" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">3</text>
<text x="570" y="150" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">4</text>
<text x="710" y="118" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#9b4a3f">5</text>

<!-- nodes 1-4: ink -->
<circle cx="150" cy="244" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="290" cy="228" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="430" cy="200" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="570" cy="172" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<!-- node 5: the marked failure -->
<circle cx="710" cy="140" r="8" fill="#9b4a3f" stroke="#9b4a3f" stroke-width="1.4"/>

<!-- the gap this lane's check never sees -->
<line x1="710" y1="148" x2="710" y2="250" stroke="#9b4a3f" stroke-width="1" stroke-dasharray="3,3"/>
<circle cx="710" cy="148" r="3.2" fill="#ffffff" stroke="#9b4a3f" stroke-width="1.4"/>
<circle cx="710" cy="250" r="3.2" fill="#ffffff" stroke="#9b4a3f" stroke-width="1.4"/>
<text x="726" y="192" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#9b4a3f">the gap no</text>
<text x="726" y="206" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#9b4a3f">local check catches</text>

<line x1="0" y1="272" x2="880" y2="272" stroke="#e8e8e8" stroke-width="1"/>

<!-- LANE B: checked against the original task -->
<text x="24" y="296" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.2" fill="#1a1a1a">CHECKED AGAINST THE ORIGINAL TASK</text>

<line x1="110" y1="452" x2="810" y2="452" stroke="#6b6b6b" stroke-width="1.1" stroke-dasharray="4,4"/>
<text x="40" y="456" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#6b6b6b">TASK</text>

<!-- chain stays on the task line throughout -->
<polyline points="150,452 290,452 430,452 570,452 710,452" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- the same drift attempt at step 3, this time caught -->
<line x1="430" y1="452" x2="430" y2="412" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3,3"/>
<circle cx="430" cy="410" r="6" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="430" y="414" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#6b6b6b">✗</text>
<text x="448" y="400" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">same drift, checked</text>
<text x="448" y="414" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">against the task, rejected</text>

<!-- hop labels above each node, all ink: this lane has no marked failure -->
<text x="150" y="438" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">1</text>
<text x="290" y="438" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">2</text>
<text x="430" y="438" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">3</text>
<text x="570" y="438" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">4</text>
<text x="710" y="438" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">5</text>

<circle cx="150" cy="452" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="290" cy="452" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="430" cy="452" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="570" cy="452" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="710" cy="452" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>

<!-- legend -->
<line x1="0" y1="486" x2="880" y2="486" stroke="#e8e8e8" stroke-width="1"/>

<circle cx="28" cy="507" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="46" y="511" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">a step's output, this run</text>

<circle cx="310" cy="507" r="6" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="328" y="511" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">a drift attempt, rejected by the check</text>

<circle cx="590" cy="507" r="7" fill="#9b4a3f" stroke="#9b4a3f" stroke-width="1.4"/>
<text x="612" y="511" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">still wrong, though every local check passed</text>

<line x1="0" y1="530" x2="880" y2="530" stroke="#1a1a1a" stroke-width="1"/>

<text x="0" y="554" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">A check against the step before only asks whether this hop is consistent with that one, never with the task.</text>
<text x="0" y="574" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#6b6b6b">Anchor the check to the task instead, and the same drift at step 3 is caught before step 5 ever runs.</text>
</svg>
