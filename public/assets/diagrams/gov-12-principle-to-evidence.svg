<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" role="img" aria-label="A principle becomes four more things: a commitment that names a breach, a test with its threshold, one owner who hears first if it fails, and a row in the evidence pack. For the assistant, reliability and safety becomes: fewer than 1 in 100 drafts states a wrong fee, date or policy term; 500 unseen emails, passing on the 95% bound under 1%; the AI lead, with MRM rerunning it; row 10 of the pack, the evaluation report. 'We use AI responsibly' has none of the four. Without a test, a principle is a slogan."><rect width="880" height="316" fill="#fff"/>
<rect x="10" y="28" width="148" height="54" fill="#fff" stroke="#1a1a1a" stroke-width="1"/>
