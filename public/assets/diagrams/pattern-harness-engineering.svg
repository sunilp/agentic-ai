<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-label="Two panels compare where reliability comes from. Left, a small ink-bordered box labeled MODEL, beneath it three failures only a better model actually fixes: a plan wrong from the start, a fact invented and undetected, judgment on a genuinely ambiguous call. Right, a single brick-bordered container labeled THE HARNESS holds a three by three grid of Kulkarni's nine named components, each tagged with the specific kind of reliability it buys: orchestration keeps the workflow bounded, tool boundaries set what can be reached, state persistence buys resumability, retries and fallbacks buy availability, validation buys rule-checked correctness, observability buys traceability, human review buys accountability, and reflection loops, drawn with a dashed border because it is a model call rather than a rule, buys trajectory correction by asking the model a narrower question. A legend explains the ink border, the dashed border and the single brick border. A closing line states that nine components catch nine different failures, and getting a better model fixes none of them directly.">
<rect width="880" height="560" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">Reliability lives in the scaffolding, not the model.</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">Nine components, credited to Kulkarni's account of Bayer's PRINCE, mapped to the failure each one actually catches.</text>
<line x1="0" y1="76" x2="880" y2="76" stroke="#1a1a1a" stroke-width="1"/>

<!-- LEFT: the model -->
<text x="20" y="100" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">THE MODEL</text>
<text x="20" y="118" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#6b6b6b">one component, one job: the next token</text>

<rect x="20" y="134" width="210" height="64" rx="4" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="125" y="172" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#1a1a1a">MODEL</text>

<text x="20" y="224" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#6b6b6b">what a better model actually fixes</text>
<text x="20" y="246" font-family="Georgia,'EB Garamond',serif" font-size="11" fill="#1a1a1a">- a plan wrong from the start</text>
<text x="20" y="268" font-family="Georgia,'EB Garamond',serif" font-size="11" fill="#1a1a1a">- a fact invented, undetected</text>
<text x="20" y="290" font-family="Georgia,'EB Garamond',serif" font-size="11" fill="#1a1a1a">- judgment on an ambiguous call</text>

<line x1="20" y1="320" x2="230" y2="320" stroke="#e8e8e8" stroke-width="1"/>
<text x="20" y="342" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">reflection loops (right) route</text>
<text x="20" y="360" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">back here, a narrower question,</text>
<text x="20" y="378" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">not a different kind of check</text>

<!-- RIGHT: the harness, single brick element -->
<rect x="268" y="90" width="594" height="378" rx="4" fill="#fafaf8" stroke="#9b4a3f" stroke-width="2.4"/>
<text x="286" y="114" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="0.5" fill="#9b4a3f">THE HARNESS</text>
<text x="286" y="130" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#9b4a3f">Kulkarni's nine, engineered around the box on the left</text>

<!-- grid: 3 columns x 178, 3 rows x 92, gap 12 -->
<!-- row 1 -->
<rect x="286" y="148" width="178" height="92" rx="3" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="300" y="172" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-weight="600" font-size="12" fill="#1a1a1a">Orchestration</text>
<text x="300" y="192" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">buys: a bounded workflow</text>

<rect x="476" y="148" width="178" height="92" rx="3" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="490" y="172" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-weight="600" font-size="12" fill="#1a1a1a">Tool boundaries</text>
<text x="490" y="192" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">buys: scope</text>

<rect x="666" y="148" width="178" height="92" rx="3" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="680" y="172" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-weight="600" font-size="12" fill="#1a1a1a">State persistence</text>
<text x="680" y="192" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">buys: resumability</text>

<!-- row 2 -->
<rect x="286" y="252" width="178" height="92" rx="3" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="300" y="276" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-weight="600" font-size="12" fill="#1a1a1a">Retries</text>
<text x="300" y="296" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">buys: availability</text>

<rect x="476" y="252" width="178" height="92" rx="3" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="490" y="276" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-weight="600" font-size="12" fill="#1a1a1a">Fallbacks</text>
<text x="490" y="296" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">buys: vendor availability</text>

<rect x="666" y="252" width="178" height="92" rx="3" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="680" y="276" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-weight="600" font-size="12" fill="#1a1a1a">Validation</text>
<text x="680" y="296" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">buys: rule-checked correctness</text>

<!-- row 3 -->
<rect x="286" y="356" width="178" height="92" rx="3" fill="#fafaf8" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="300" y="380" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-weight="600" font-size="12" fill="#1a1a1a">Reflection loops</text>
<text x="300" y="400" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">buys: trajectory, not a rule</text>
<text x="300" y="418" font-family="Georgia,'EB Garamond',serif" font-size="9.5" font-style="italic" fill="#6b6b6b">(still a model call)</text>

<rect x="476" y="356" width="178" height="92" rx="3" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="490" y="380" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-weight="600" font-size="12" fill="#1a1a1a">Observability</text>
<text x="490" y="400" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">buys: traceability</text>

<rect x="666" y="356" width="178" height="92" rx="3" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="680" y="380" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-weight="600" font-size="12" fill="#1a1a1a">Human review</text>
<text x="680" y="400" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">buys: accountability</text>

<line x1="0" y1="478" x2="880" y2="478" stroke="#e8e8e8" stroke-width="1"/>

<!-- legend -->
<rect x="20" y="492" width="14" height="10" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="40" y="501" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">the model: judgment, no rule behind it</text>

<rect x="340" y="492" width="14" height="10" fill="#fafaf8" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="360" y="501" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">a model call living inside the harness</text>

<rect x="650" y="492" width="14" height="10" fill="#fafaf8" stroke="#9b4a3f" stroke-width="2.2"/>
<text x="670" y="501" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">the harness: engineered around it</text>

<line x1="0" y1="520" x2="880" y2="520" stroke="#1a1a1a" stroke-width="1"/>

<text x="0" y="544" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">Nine components catch nine different failures. Getting a better model fixes none of them directly.</text>
</svg>
