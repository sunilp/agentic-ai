<svg xmlns="http://www.w3.org/2000/svg" width="880" height="750" viewBox="0 0 880 750" role="img" aria-label="Four properties, scope, magnitude, expiry and revocation, feed a single conjunction: a bounded grant only if all four are present. Below, four rows show what one missing property opens on its own: no scope is a blank cheque, no magnitude is a blank cheque on a narrower page, no expiry is the permanent hole, and no revocation, marked in brick, leaves no remedy but waiting.">
<defs><marker id="a1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#1a1a1a"/></marker></defs>
<rect width="880" height="750" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">Bounded Grant: four properties, and none of them optional</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">Scope, magnitude, expiry, revocation. Drop any one and what is left is not a bounded grant.</text>
<line x1="0" y1="64" x2="880" y2="64" stroke="#1a1a1a" stroke-width="1"/>

<text x="24" y="84" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.6" fill="#6b6b6b">THE CONJUNCTION</text>

<!-- four property boxes -->
<rect x="30" y="94" width="190" height="92" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="46" y="120" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">SCOPE</text>
<text x="46" y="142" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">what may be done</text>
<text x="46" y="162" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">a boundary on action</text>

<rect x="240" y="94" width="190" height="92" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="256" y="120" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">MAGNITUDE</text>
<text x="256" y="142" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">how much</text>
<text x="256" y="162" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">a boundary on size</text>

<rect x="450" y="94" width="190" height="92" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="466" y="120" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">EXPIRY</text>
<text x="466" y="142" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">until when</text>
<text x="466" y="162" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">a boundary on time</text>

<rect x="660" y="94" width="190" height="92" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="676" y="120" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">REVOCATION</text>
<text x="676" y="142" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">how it's taken back</text>
<text x="676" y="162" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">a boundary early, on demand</text>

<!-- plus connectors between boxes -->
<text x="230" y="146" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#1a1a1a">+</text>
<text x="440" y="146" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#1a1a1a">+</text>
<text x="650" y="146" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="16" fill="#1a1a1a">+</text>

<!-- collector lines down to the summary box -->
<line x1="125" y1="186" x2="125" y2="204" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="335" y1="186" x2="335" y2="204" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="545" y1="186" x2="545" y2="204" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="755" y1="186" x2="755" y2="204" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="125" y1="204" x2="755" y2="204" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="440" y1="204" x2="440" y2="222" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#a1)"/>

<!-- summary box -->
<rect x="270" y="224" width="340" height="40" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="440" y="249" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="0.4" fill="#1a1a1a">BOUNDED GRANT, ALL FOUR PRESENT</text>

<text x="440" y="286" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="12.5" font-style="italic" fill="#6b6b6b">Three of four is not a bounded grant. It's an unbounded grant with paperwork.</text>

<line x1="0" y1="302" x2="880" y2="302" stroke="#e8e8e8" stroke-width="1"/>

<text x="24" y="322" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.6" fill="#6b6b6b">WHAT ONE MISSING PROPERTY OPENS UP</text>
<line x1="24" y1="330" x2="856" y2="330" stroke="#1a1a1a" stroke-width="1"/>

<!-- row 1: SCOPE MISSING -->
<rect x="0" y="338" width="880" height="84" fill="#fafaf8"/>
<text x="46" y="366" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#1a1a1a">1&#160;&#160;SCOPE MISSING</text>
<text x="46" y="388" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">no boundary on what may be done</text>
<rect x="280" y="364" width="576" height="24" fill="#6b6b6b"/>
<text x="280" y="404" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#6b6b6b">= A BLANK CHEQUE</text>
<line x1="0" y1="422" x2="880" y2="422" stroke="#e8e8e8" stroke-width="1"/>

<!-- row 2: MAGNITUDE MISSING -->
<text x="46" y="450" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#1a1a1a">2&#160;&#160;MAGNITUDE MISSING</text>
<text x="46" y="472" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">no ceiling on how much</text>
<rect x="280" y="448" width="400" height="24" fill="#6b6b6b"/>
<text x="280" y="488" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#6b6b6b">= A BLANK CHEQUE, NARROWER SUBJECT</text>
<line x1="0" y1="506" x2="880" y2="506" stroke="#e8e8e8" stroke-width="1"/>

<!-- row 3: EXPIRY MISSING -->
<rect x="0" y="506" width="880" height="84" fill="#fafaf8"/>
<text x="46" y="534" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#1a1a1a">3&#160;&#160;EXPIRY MISSING</text>
<text x="46" y="556" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">no boundary on until when</text>
<rect x="280" y="532" width="576" height="24" fill="#6b6b6b"/>
<text x="280" y="572" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#6b6b6b">= THE PERMANENT HOLE</text>
<line x1="0" y1="590" x2="880" y2="590" stroke="#e8e8e8" stroke-width="1"/>

<!-- row 4: REVOCATION MISSING, the marked row -->
<rect x="0" y="590" width="880" height="84" fill="#f5ece9"/>
<rect x="0" y="590" width="3" height="84" fill="#9b4a3f"/>
<text x="46" y="618" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#9b4a3f">4&#160;&#160;REVOCATION MISSING</text>
<text x="46" y="640" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#9b4a3f">no way to take it back early</text>
<rect x="280" y="616" width="576" height="24" fill="#9b4a3f"/>
<text x="280" y="656" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#9b4a3f">= NO REMEDY BUT WAITING</text>

<line x1="0" y1="674" x2="880" y2="674" stroke="#1a1a1a" stroke-width="1"/>

<rect x="20" y="686" width="14" height="10" fill="#6b6b6b"/>
<text x="40" y="695" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">one property missing, still unbounded in that dimension</text>
<rect x="470" y="686" width="14" height="10" fill="#9b4a3f"/>
<text x="490" y="695" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">the one no expiry date can substitute for</text>

<text x="0" y="716" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">A grant is bounded only if all four hold at once. Three of four is not a narrower grant, it's an unbounded one with paperwork.</text>
<text x="0" y="736" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#6b6b6b">Expiry sets when authority ends by default. Revocation is how it ends on purpose, before that.</text>
</svg>
