<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 482" role="img" aria-label="Who decides, by tier. Four rows across T1 to T4. Build, meaning approve the risk assessment: AI Risk Committee, AI Risk, team lead, team lead. Validate: MRM in full, MRM or another second-line reviewer in reduced scope, a peer who is not the developer, a self-test. Ship: AI Risk Committee with the CISO and, for personal data, the DPO; Head of AI with the Business Unit Head; team lead with the business owner; team lead. Exception: AI Risk Committee, Head of AI Risk, Head of AI, team lead. Cells decided outside the build team are shaded: every T1 and T2 cell, and the T3 exception. Two rows apply at every tier: a material change goes back to the ship approver after revalidation, and whoever is on call can stop a system first and tell the owners after."><rect width="880" height="482" fill="#fff"/>
