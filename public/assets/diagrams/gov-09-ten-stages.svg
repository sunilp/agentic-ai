<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 366" role="img" aria-label="The framework's ten stages with a gate before each. Stages 1 and 2, intake and risk assessment with tiering, are shared. The tier then picks a lane. T1 and T2 systems run stages 3 to 7 with signers outside the team. The fast lane runs T3 and T4 through the same stages with a lighter pack and no committee. Both lanes meet the last gate before go-live. After go-live come operations, review and retirement, and a material change means the tier is checked again at stage 2."><rect width="880" height="366" fill="#fff"/>
