<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 226" role="img" aria-label="The reporting loop: notice, report, thank, fix, share, and back to notice. Each fix lands as an evaluation case or a control change."><rect width="880" height="226" fill="#fff"/>
