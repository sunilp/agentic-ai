<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-label="A line chart of a detector's recall across twenty releases, indexed to 100 at go-live, falling under 2 percent relative to the previous release each time. Every release passes that baseline comparison. A dashed floor line marks the absolute minimum recall set at go-live. From about the twelfth release onward the curve sits below that floor while every release in that span still passes the baseline-only gate, ending near 68.">
<rect width="880" height="600" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">Twenty releases pass. The floor is the only check that notices.</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">A worked illustration, not a measurement: recall drops under 2 percent each release, always against the one before it.</text>
<line x1="0" y1="76" x2="880" y2="76" stroke="#1a1a1a" stroke-width="1"/>

<!-- zone already below the floor, every release in it still passing the baseline check -->
<rect x="502" y="270" width="318" height="160" fill="#f5ece9"/>
<rect x="502" y="270" width="3" height="160" fill="#9b4a3f"/>

<!-- floor: the fixed, absolute line -->
<line x1="60" y1="270" x2="820" y2="270" stroke="#9b4a3f" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="64" y="263" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="0.5" fill="#9b4a3f">FLOOR</text>
<text x="64" y="279" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#9b4a3f">set at go-live, moved only by the threshold owner</text>

<!-- axis labels -->
<text x="60" y="94" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.4" fill="#6b6b6b">RECALL INDEX, GO-LIVE = 100</text>
<text x="52" y="114" text-anchor="end" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#1a1a1a">100</text>
<text x="826" y="369" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#1a1a1a">&#8776;68</text>

<!-- the recall curve: every step passes the release directly before it -->
<polyline points="60,110.0 98,125.2 136,140.1 174,154.7 212,169.1 250,183.2 288,197.0 326,210.6 364,223.9 402,236.9 440,249.8 478,262.4 516,274.7 554,286.9 592,298.8 630,310.5 668,322.0 706,333.3 744,344.3 782,355.2 820,365.9" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="60" cy="110.0" r="2.3" fill="#1a1a1a"/>
<circle cx="98" cy="125.2" r="2.3" fill="#1a1a1a"/>
<circle cx="136" cy="140.1" r="2.3" fill="#1a1a1a"/>
<circle cx="174" cy="154.7" r="2.3" fill="#1a1a1a"/>
<circle cx="212" cy="169.1" r="2.3" fill="#1a1a1a"/>
<circle cx="250" cy="183.2" r="2.3" fill="#1a1a1a"/>
<circle cx="288" cy="197.0" r="2.3" fill="#1a1a1a"/>
<circle cx="326" cy="210.6" r="2.3" fill="#1a1a1a"/>
<circle cx="364" cy="223.9" r="2.3" fill="#1a1a1a"/>
<circle cx="402" cy="236.9" r="2.3" fill="#1a1a1a"/>
<circle cx="440" cy="249.8" r="2.3" fill="#1a1a1a"/>
<circle cx="478" cy="262.4" r="2.3" fill="#1a1a1a"/>
<circle cx="516" cy="274.7" r="2.3" fill="#1a1a1a"/>
<circle cx="554" cy="286.9" r="2.3" fill="#1a1a1a"/>
<circle cx="592" cy="298.8" r="2.3" fill="#1a1a1a"/>
<circle cx="630" cy="310.5" r="2.3" fill="#1a1a1a"/>
<circle cx="668" cy="322.0" r="2.3" fill="#1a1a1a"/>
<circle cx="706" cy="333.3" r="2.3" fill="#1a1a1a"/>
<circle cx="744" cy="344.3" r="2.3" fill="#1a1a1a"/>
<circle cx="782" cy="355.2" r="2.3" fill="#1a1a1a"/>
<circle cx="820" cy="365.9" r="2.3" fill="#1a1a1a"/>

<!-- crossing point: where the position first falls under the floor -->
<circle cx="502" cy="270" r="3.4" fill="#ffffff" stroke="#9b4a3f" stroke-width="1.6"/>
<line x1="502" y1="270" x2="502" y2="392" stroke="#9b4a3f" stroke-width="1" stroke-dasharray="3,3"/>
<circle cx="502" cy="392" r="3.2" fill="#ffffff" stroke="#9b4a3f" stroke-width="1.4"/>
<text x="512" y="388" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#9b4a3f">already below the floor,</text>
<text x="512" y="402" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#9b4a3f">still passing every release check</text>

<!-- x-axis -->
<line x1="60" y1="430" x2="820" y2="430" stroke="#1a1a1a" stroke-width="1"/>
<line x1="60" y1="430" x2="60" y2="434" stroke="#1a1a1a" stroke-width="1"/>
<line x1="250" y1="430" x2="250" y2="434" stroke="#1a1a1a" stroke-width="1"/>
<line x1="440" y1="430" x2="440" y2="434" stroke="#1a1a1a" stroke-width="1"/>
<line x1="630" y1="430" x2="630" y2="434" stroke="#1a1a1a" stroke-width="1"/>
<line x1="820" y1="430" x2="820" y2="434" stroke="#1a1a1a" stroke-width="1"/>
<text x="60" y="446" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">0</text>
<text x="250" y="446" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">5</text>
<text x="440" y="446" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">10</text>
<text x="630" y="446" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">15</text>
<text x="820" y="446" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">20</text>
<text x="820" y="463" text-anchor="end" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.4" fill="#6b6b6b">RELEASE, EACH COMPARED ONLY TO THE ONE BEFORE IT</text>

<!-- legend -->
<line x1="40" y1="515" x2="70" y2="515" stroke="#1a1a1a" stroke-width="2"/>
<text x="78" y="519" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">recall after each release</text>

<line x1="340" y1="515" x2="370" y2="515" stroke="#9b4a3f" stroke-width="1.4" stroke-dasharray="4,4"/>
<text x="378" y="519" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">the floor, set once at go-live</text>

<rect x="622" y="510" width="14" height="10" fill="#f5ece9"/>
<rect x="622" y="510" width="2" height="10" fill="#9b4a3f"/>
<text x="642" y="519" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">below floor, still passing every check</text>

<line x1="0" y1="546" x2="880" y2="546" stroke="#e8e8e8" stroke-width="1"/>

<text x="0" y="568" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">Every point above passes the release directly before it, including the eight sitting under the floor.</text>
<text x="0" y="588" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#6b6b6b">A baseline-only gate never looks past one step back. A floor does not care how the position got there.</text>
</svg>
