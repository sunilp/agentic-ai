<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-label="Three cards, one axis each, all measuring the same Lab-002 increment: a dynamic multi-agent graph against a static router. Accuracy: router 16.7 percent pass against graph 10.0 percent, lost. Cost: 290 tokens for the router against 6,256 tokens and 16.93 calls for the graph, 21.56 times more, lost. Durability: a naive harness would re-run everything after a crash; the graph's durable runtime re-ran zero of 17 calls across five crash tests, won.">
<rect width="880" height="540" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">One increment, three verdicts</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">Lab-002 measured the same dynamic multi-agent graph against a static router, on three axes named before the build.</text>
<line x1="0" y1="76" x2="880" y2="76" stroke="#1a1a1a" stroke-width="1"/>

<!-- CARD 1: ACCURACY, lost -->
<rect x="40" y="92" width="250" height="336" fill="#fafaf8"/>
<text x="60" y="126" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#1a1a1a">1</text>
<text x="86" y="126" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="0.6" fill="#1a1a1a">ACCURACY</text>
<text x="60" y="150" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#6b6b6b">the bar the finding has to clear</text>
<line x1="60" y1="164" x2="270" y2="164" stroke="#e8e8e8" stroke-width="1"/>

<text x="60" y="186" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" fill="#6b6b6b">ROUTER</text>
<text x="60" y="210" font-family="Georgia,'EB Garamond',serif" font-size="17" fill="#1a1a1a">16.7% pass</text>
<text x="60" y="226" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">LLM-judge pass rate</text>

<text x="60" y="256" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" fill="#6b6b6b">GRAPH</text>
<text x="60" y="280" font-family="Georgia,'EB Garamond',serif" font-size="17" fill="#1a1a1a">10.0% pass</text>
<text x="60" y="296" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">same weak local model</text>

<text x="60" y="330" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">Named in advance. Checked.</text>
<text x="60" y="348" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">The graph scored lower.</text>

<rect x="60" y="382" width="86" height="27" fill="#6b6b6b"/>
<text x="103" y="400" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="1" fill="#ffffff">LOST</text>

<!-- CARD 2: COST, lost -->
<rect x="315" y="92" width="250" height="336" fill="#fafaf8"/>
<text x="335" y="126" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#1a1a1a">2</text>
<text x="361" y="126" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="0.6" fill="#1a1a1a">COST</text>
<text x="335" y="150" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#6b6b6b">tokens and calls, per incident</text>
<line x1="335" y1="164" x2="545" y2="164" stroke="#e8e8e8" stroke-width="1"/>

<text x="335" y="186" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" fill="#6b6b6b">ROUTER</text>
<text x="335" y="210" font-family="Georgia,'EB Garamond',serif" font-size="17" fill="#1a1a1a">290 tokens</text>
<text x="335" y="226" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">1 model call</text>

<text x="335" y="256" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" fill="#6b6b6b">GRAPH</text>
<text x="335" y="280" font-family="Georgia,'EB Garamond',serif" font-size="17" fill="#1a1a1a">6,256 tokens</text>
<text x="335" y="296" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">16.93 model calls</text>

<text x="335" y="330" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">21.56x more tokens, spent</text>
<text x="335" y="348" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">on the lower pass rate above.</text>

<rect x="335" y="382" width="86" height="27" fill="#6b6b6b"/>
<text x="378" y="400" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="1" fill="#ffffff">LOST</text>

<!-- CARD 3: DURABILITY, won (single brick accent) -->
<rect x="590" y="92" width="250" height="336" fill="#f5ece9"/>
<rect x="590" y="92" width="3" height="336" fill="#9b4a3f"/>
<text x="610" y="126" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#9b4a3f">3</text>
<text x="636" y="126" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="0.6" fill="#9b4a3f">DURABILITY</text>
<text x="610" y="150" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#9b4a3f">work recovered after a crash</text>
<line x1="610" y1="164" x2="820" y2="164" stroke="#e0c9c3" stroke-width="1"/>

<text x="610" y="186" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" fill="#6b6b6b">NAIVE HARNESS · NOT TESTED</text>
<text x="610" y="210" font-family="Georgia,'EB Garamond',serif" font-size="17" fill="#1a1a1a">re-runs all of it</text>
<text x="610" y="226" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">every prior call, from zero</text>

<text x="610" y="256" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.8" fill="#9b4a3f">GRAPH + DURABLE RUNTIME</text>
<text x="610" y="280" font-family="Georgia,'EB Garamond',serif" font-size="17" fill="#9b4a3f">0 of 17 calls</text>
<text x="610" y="296" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#9b4a3f">re-run, avg across 5 crash tests</text>

<text x="610" y="330" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">Named in advance. Checked.</text>
<text x="610" y="348" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">The graph recovered outright.</text>

<rect x="610" y="382" width="86" height="27" fill="#9b4a3f"/>
<text x="653" y="400" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="1" fill="#ffffff">WON</text>

<line x1="0" y1="450" x2="880" y2="450" stroke="#e8e8e8" stroke-width="1"/>

<rect x="0" y="466" width="14" height="10" fill="#6b6b6b"/>
<text x="20" y="475" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">axis lost, measured</text>
<rect x="200" y="466" width="14" height="10" fill="#f5ece9"/>
<rect x="200" y="466" width="2" height="10" fill="#9b4a3f"/>
<text x="220" y="475" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">axis won, measured</text>

<text x="0" y="500" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">Same architecture, same run, three axes named before the build. Two say no. One says yes.</text>
<text x="0" y="520" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#6b6b6b">The axis you check first is the axis that decides which of these three cards you get to write.</text>
</svg>
