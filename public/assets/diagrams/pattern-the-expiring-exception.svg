<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-label="Two exception records granted the same day for the same control. Record A carries a mandatory expiry and reverts to enforcing when it lapses, so renewal is a new decision. Record B has no expiry, and a year later it is still relaxed, off any register, because nothing was ever there to force the question again.">
<rect width="880" height="520" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">The expiry is the control, not the approval</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">Same request, same approver, same compensating control. One field apart, and one year later, that field is all that mattered.</text>
<line x1="0" y1="66" x2="880" y2="66" stroke="#1a1a1a" stroke-width="1"/>

<!-- ================= CARD A: EXPIRY SET ================= -->
<rect x="20" y="92" width="390" height="320" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="40" y="116" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">A: EXPIRY SET</text>
<line x1="20" y1="126" x2="410" y2="126" stroke="#e8e8e8" stroke-width="1"/>

<text x="40" y="150" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">id: EXC-2026-0143</text>
<text x="40" y="170" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">control: pii_in_response.mask</text>
<text x="40" y="190" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">compensating_control: entitlement filter enforcing</text>
<text x="40" y="210" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">approved_by: risk.director.markets</text>
<text x="40" y="230" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">granted: 2026-08-19</text>
<text x="40" y="250" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">expires: 2026-11-19</text>
<text x="40" y="270" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">review_owner: platform.guardrails</text>

<line x1="20" y1="288" x2="410" y2="288" stroke="#e8e8e8" stroke-width="1"/>
<text x="40" y="304" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.2" fill="#6b6b6b">A YEAR LATER</text>

<line x1="40" y1="336" x2="390" y2="336" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="40" cy="336" r="4" fill="#1a1a1a"/>
<text x="40" y="322" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" letter-spacing="0.4" fill="#6b6b6b">GRANTED</text>
<text x="40" y="352" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#1a1a1a">2026-08-19</text>

<line x1="147" y1="328" x2="147" y2="344" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="147" cy="336" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="147" y="318" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" letter-spacing="0.4" fill="#6b6b6b">EXPIRES</text>
<text x="147" y="352" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#1a1a1a">2026-11-19</text>

<circle cx="390" cy="336" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="390" y="322" text-anchor="end" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#6b6b6b">2027-08-19</text>
<text x="390" y="356" text-anchor="end" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="0.4" fill="#1a1a1a">CLOSED</text>
<text x="390" y="374" text-anchor="end" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">renewal is a new decision</text>

<!-- ================= CARD B: NO EXPIRY (marked) ================= -->
<rect x="470" y="92" width="390" height="320" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1"/>
<text x="490" y="116" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">B: NO EXPIRY</text>
<line x1="470" y1="126" x2="860" y2="126" stroke="#e8e8e8" stroke-width="1"/>

<text x="490" y="150" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">id: EXC-2026-0201</text>
<text x="490" y="170" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">control: pii_in_response.mask</text>
<text x="490" y="190" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">compensating_control: entitlement filter enforcing</text>
<text x="490" y="210" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">approved_by: risk.director.markets</text>
<text x="490" y="230" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">granted: 2026-08-19</text>
<text x="490" y="250" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6b6b6b">expires: (not set)</text>
<text x="490" y="270" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#6b6b6b">review_owner: (not set)</text>

<!-- the marked element: everything from here down is what a missing expiry produces one year on -->
<rect x="470" y="290" width="390" height="114" fill="#f5ece9"/>
<rect x="470" y="290" width="3" height="114" fill="#9b4a3f"/>
<text x="490" y="304" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.2" fill="#9b4a3f">A YEAR LATER</text>

<line x1="490" y1="336" x2="597" y2="336" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="597" y1="336" x2="840" y2="336" stroke="#9b4a3f" stroke-width="1.4" stroke-dasharray="4,4"/>
<circle cx="490" cy="336" r="4" fill="#1a1a1a"/>
<text x="490" y="322" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" letter-spacing="0.4" fill="#6b6b6b">GRANTED</text>
<text x="490" y="352" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#1a1a1a">2026-08-19</text>

<text x="597" y="352" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="9.5" font-style="italic" fill="#9b4a3f">no review point</text>

<circle cx="840" cy="336" r="5.5" fill="#9b4a3f"/>
<text x="840" y="322" text-anchor="end" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#9b4a3f">2027-08-19</text>
<text x="840" y="356" text-anchor="end" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="0.4" fill="#9b4a3f">STILL ACTIVE</text>
<text x="840" y="374" text-anchor="end" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#9b4a3f">never came up for review</text>

<line x1="0" y1="432" x2="880" y2="432" stroke="#1a1a1a" stroke-width="1"/>

<circle cx="30" cy="452" r="4" fill="#1a1a1a"/>
<text x="46" y="456" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">granted, same day, same approver, same compensating control</text>

<circle cx="30" cy="474" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="46" y="478" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">expiry reached: control resumes, renewal is argued for again</text>

<circle cx="490" cy="452" r="4" fill="#9b4a3f"/>
<text x="506" y="456" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">no expiry: nothing happens, the relaxation just continues</text>

<text x="0" y="500" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">Approval was identical on both sides. The record that expires came back for a decision; the one that doesn't, never did.</text>
</svg>
