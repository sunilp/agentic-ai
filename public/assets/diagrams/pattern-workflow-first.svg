<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-label="Two lanes showing the same support query. In the workflow lane, a switch decided in code before the run fans out to four known categories, billing, technical, account, escalation, and a case outside those four is curved around the switch and forced into the nearest branch anyway. In the agent loop lane, a decision made live during the run reaches the same four categories, plus a fifth path, marked in brick, that exists only because the decision was made at runtime rather than fixed in advance. The same column in the workflow lane sits empty, marked as no fifth path exists.">
<rect width="880" height="600" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">The same task, fixed branches or a live decision</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">One support query, routed four known ways either way. The difference shows up only on the case nobody listed.</text>
<line x1="0" y1="70" x2="880" y2="70" stroke="#1a1a1a" stroke-width="1"/>

<!-- ============ TOP LANE: WORKFLOW ============ -->
<text x="24" y="90" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#1a1a1a">WORKFLOW</text>

<!-- unknown / unlisted input -->
<circle cx="46" cy="104" r="6" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="46" y="107.5" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#6b6b6b">?</text>
<text x="62" y="101" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">a case outside</text>
<text x="62" y="113" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">the four, unlisted</text>

<!-- normal input -->
<circle cx="46" cy="185" r="5" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="46" y="203" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">query</text>
<line x1="52" y1="185" x2="148" y2="185" stroke="#1a1a1a" stroke-width="1.2"/>

<!-- hub 1: switch, a diamond, decided in code -->
<polygon points="170,163 192,185 170,207 148,185" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="170" y="150" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">SWITCH</text>
<text x="170" y="268" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">fixed before the run</text>

<!-- 4 known branches -->
<line x1="192" y1="185" x2="280" y2="121" stroke="#1a1a1a" stroke-width="1.1"/>
<line x1="192" y1="185" x2="280" y2="158" stroke="#1a1a1a" stroke-width="1.1"/>
<line x1="192" y1="185" x2="280" y2="212" stroke="#1a1a1a" stroke-width="1.1"/>
<line x1="192" y1="185" x2="280" y2="249" stroke="#1a1a1a" stroke-width="1.1"/>

<rect x="280" y="109" width="120" height="24" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="340" y="125" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.3" fill="#1a1a1a">BILLING</text>

<rect x="280" y="146" width="120" height="24" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="340" y="162" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.3" fill="#1a1a1a">TECHNICAL</text>

<rect x="280" y="200" width="120" height="24" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="340" y="216" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.3" fill="#1a1a1a">ACCOUNT</text>

<rect x="280" y="237" width="120" height="24" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="340" y="253" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.3" fill="#1a1a1a">ESCALATION</text>

<!-- the unlisted case, curved around the switch, forced into the nearest branch -->
<path d="M46,110 C60,180 140,230 276,249" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3,3"/>
<circle cx="276" cy="249" r="3" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.2"/>
<text x="410" y="245" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">unlisted case, forced in</text>
<text x="410" y="258" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">anyway, same confidence</text>

<!-- the ghost column: no fifth path in the workflow -->
<rect x="520" y="172" width="160" height="26" fill="none" stroke="#d9d9d9" stroke-width="1" stroke-dasharray="3,3"/>
<text x="600" y="189" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#bdbdbd">no fifth path exists</text>

<line x1="0" y1="280" x2="880" y2="280" stroke="#e8e8e8" stroke-width="1"/>

<!-- ============ BOTTOM LANE: AGENT LOOP ============ -->
<text x="24" y="300" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.4" fill="#1a1a1a">AGENT LOOP</text>

<!-- the same unlisted case, this time reaching the decision -->
<circle cx="46" cy="314" r="6" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="46" y="317.5" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#6b6b6b">?</text>
<text x="62" y="311" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">the same case,</text>
<text x="62" y="323" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">reaching the decision</text>

<!-- normal input -->
<circle cx="46" cy="400" r="5" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="46" y="418" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">query</text>
<line x1="52" y1="400" x2="148" y2="400" stroke="#1a1a1a" stroke-width="1.2"/>

<!-- hub 2: a circle, decided live, each step -->
<circle cx="170" cy="400" r="22" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="170" y="363" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">DECIDE</text>
<text x="170" y="443" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">live, during the run</text>

<!-- the same 4 known branches, reached the same way, at a higher cost the diagram does not need to relitigate -->
<line x1="192" y1="400" x2="280" y2="336" stroke="#1a1a1a" stroke-width="1.1"/>
<line x1="192" y1="400" x2="280" y2="373" stroke="#1a1a1a" stroke-width="1.1"/>
<line x1="192" y1="400" x2="280" y2="427" stroke="#1a1a1a" stroke-width="1.1"/>
<line x1="192" y1="400" x2="280" y2="464" stroke="#1a1a1a" stroke-width="1.1"/>

<rect x="280" y="324" width="120" height="24" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="340" y="340" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.3" fill="#1a1a1a">BILLING</text>

<rect x="280" y="361" width="120" height="24" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="340" y="377" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.3" fill="#1a1a1a">TECHNICAL</text>

<rect x="280" y="415" width="120" height="24" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="340" y="431" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.3" fill="#1a1a1a">ACCOUNT</text>

<rect x="280" y="452" width="120" height="24" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="340" y="468" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="0.3" fill="#1a1a1a">ESCALATION</text>

<!-- the unlisted case, this time reaching the decision itself -->
<path d="M46,320 C60,360 120,385 168,392" fill="none" stroke="#6b6b6b" stroke-width="1" stroke-dasharray="3,3"/>

<!-- what autonomy actually buys: a path that did not exist before, threaded through the gap between the two middle branches -->
<line x1="192" y1="400" x2="520" y2="400" stroke="#9b4a3f" stroke-width="1.6"/>
<rect x="520" y="387" width="160" height="26" fill="#f5ece9" stroke="#9b4a3f" stroke-width="1.6"/>
<text x="600" y="397" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="0.4" fill="#9b4a3f">NEW PATH</text>
<text x="600" y="411" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#9b4a3f">no branch existed for this</text>

<line x1="0" y1="500" x2="880" y2="500" stroke="#1a1a1a" stroke-width="1"/>

<!-- legend -->
<rect x="40" y="518" width="14" height="10" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="60" y="527" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">a known branch, same job either way</text>

<circle cx="379" cy="523" r="5" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.2" stroke-dasharray="2,2"/>
<text x="393" y="527" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">the case nobody listed</text>

<rect x="650" y="518" width="14" height="10" fill="#f5ece9" stroke="#9b4a3f" stroke-width="1.4"/>
<text x="670" y="527" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">what autonomy actually buys</text>

<line x1="0" y1="548" x2="880" y2="548" stroke="#e8e8e8" stroke-width="1"/>

<text x="0" y="570" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">On the four known categories, the workflow and the agent loop do the same job.</text>
<text x="0" y="590" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#6b6b6b">Autonomy earns something only on the fifth case, the one no branch could have been written for.</text>
</svg>
