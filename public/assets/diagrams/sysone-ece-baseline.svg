<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-label="Measured calibration error for a detector that is perfectly calibrated, against evaluation size. At 50 rows it averages 0.104 and individual runs range from 0.036 to 0.224. The figure falls to 0.007 at ten thousand rows. Common agent-safety benchmarks sit at the small end.">
