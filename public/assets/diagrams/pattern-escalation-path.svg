<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img" aria-label="A blocked case moving down three ordered escalation levels, each with a named owner and an acknowledgement deadline that moves the case automatically when nobody acts, contrasted with an unowned queue on the right that has no owner and no deadline and simply keeps filling">
<defs>
  <marker id="downarrow" markerWidth="9" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#1a1a1a"/></marker>
  <marker id="uparrow" markerWidth="9" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#9b4a3f"/></marker>
</defs>
<rect width="880" height="660" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">Every blocked case goes somewhere. This is where.</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">Ordered levels, a named owner, an acknowledgement deadline, an automatic move when nobody acts. The alternative just fills.</text>
<line x1="0" y1="76" x2="880" y2="76" stroke="#1a1a1a" stroke-width="1"/>

<!-- LEFT: the escalation ladder, neutral ink/grey throughout -->
<text x="24" y="98" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.2" fill="#1a1a1a">WITH AN ESCALATION PATH</text>

<rect x="20" y="108" width="420" height="106" fill="#fafaf8"/>
<text x="40" y="140" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#1a1a1a">1</text>
<text x="64" y="140" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">LEVEL 1</text>
<text x="64" y="160" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">platform on-call reviewer</text>
<text x="64" y="177" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">first line, on shift</text>
<text x="330" y="140" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#1a1a1a">0-4h</text>
<text x="330" y="157" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#6b6b6b">ack window</text>
<line x1="20" y1="214" x2="440" y2="214" stroke="#e8e8e8" stroke-width="1"/>
<line x1="40" y1="214" x2="40" y2="232" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#downarrow)"/>
<text x="56" y="228" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">silent &#8594; escalates</text>

<rect x="20" y="238" width="420" height="106" fill="#ffffff"/>
<text x="40" y="270" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#1a1a1a">2</text>
<text x="64" y="270" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">LEVEL 2</text>
<text x="64" y="290" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">platform team lead</text>
<text x="64" y="307" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">first line, the accountable owner</text>
<text x="330" y="270" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#1a1a1a">4-12h</text>
<text x="330" y="287" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#6b6b6b">ack window</text>
<line x1="20" y1="344" x2="440" y2="344" stroke="#e8e8e8" stroke-width="1"/>
<line x1="40" y1="344" x2="40" y2="362" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#downarrow)"/>
<text x="56" y="358" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">silent &#8594; escalates</text>

<rect x="20" y="368" width="420" height="106" fill="#fafaf8"/>
<text x="40" y="400" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#1a1a1a">3</text>
<text x="64" y="400" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="0.6" fill="#1a1a1a">LEVEL 3</text>
<text x="64" y="420" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">privacy office</text>
<text x="64" y="437" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">second line, a rung this programme chose to add</text>
<text x="330" y="400" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12.5" fill="#1a1a1a">12-24h</text>
<text x="330" y="417" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#6b6b6b">ack window</text>
<line x1="20" y1="474" x2="440" y2="474" stroke="#1a1a1a" stroke-width="1"/>
<line x1="40" y1="474" x2="40" y2="492" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#downarrow)"/>
<text x="56" y="488" font-family="Georgia,'EB Garamond',serif" font-size="10" font-style="italic" fill="#6b6b6b">still silent, 24h</text>

<text x="40" y="516" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#1a1a1a">case stays blocked; on-call lead is paged directly.</text>

<!-- RIGHT: the queue with no owner, single accent, one marked element -->
<rect x="460" y="108" width="400" height="406" fill="#f5ece9"/>
<rect x="460" y="108" width="4" height="406" fill="#9b4a3f"/>

<text x="484" y="132" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.2" fill="#9b4a3f">NO ESCALATION PATH</text>
<text x="484" y="150" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#9b4a3f">an alert queue, not an escalation path</text>

<line x1="820" y1="208" x2="820" y2="170" stroke="#9b4a3f" stroke-width="1.4" marker-end="url(#uparrow)"/>
<text x="700" y="182" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#9b4a3f">keeps growing,</text>
<text x="700" y="196" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#9b4a3f">nobody assigned</text>

<rect x="500" y="176" width="14" height="14" fill="#9b4a3f"/>
<rect x="522" y="176" width="14" height="14" fill="#9b4a3f"/>
<rect x="544" y="176" width="14" height="14" fill="#9b4a3f"/>
<rect x="566" y="176" width="14" height="14" fill="#9b4a3f"/>
<rect x="588" y="176" width="14" height="14" fill="#9b4a3f"/>

<rect x="484" y="208" width="352" height="150" fill="#ffffff" stroke="#9b4a3f" stroke-width="1.2"/>
<g fill="#9b4a3f">
<rect x="500" y="224" width="14" height="14"/><rect x="554" y="224" width="14" height="14"/><rect x="608" y="224" width="14" height="14"/><rect x="662" y="224" width="14" height="14"/><rect x="716" y="224" width="14" height="14"/><rect x="770" y="224" width="14" height="14"/>
<rect x="500" y="256" width="14" height="14"/><rect x="554" y="256" width="14" height="14"/><rect x="608" y="256" width="14" height="14"/><rect x="662" y="256" width="14" height="14"/><rect x="716" y="256" width="14" height="14"/><rect x="770" y="256" width="14" height="14"/>
<rect x="500" y="288" width="14" height="14"/><rect x="554" y="288" width="14" height="14"/><rect x="608" y="288" width="14" height="14"/><rect x="662" y="288" width="14" height="14"/><rect x="716" y="288" width="14" height="14"/><rect x="770" y="288" width="14" height="14"/>
<rect x="500" y="320" width="14" height="14"/><rect x="554" y="320" width="14" height="14"/><rect x="608" y="320" width="14" height="14"/><rect x="662" y="320" width="14" height="14"/><rect x="716" y="320" width="14" height="14"/><rect x="770" y="320" width="14" height="14"/>
</g>

<text x="484" y="382" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#9b4a3f">no named owner</text>
<text x="484" y="401" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#9b4a3f">no acknowledgement deadline</text>
<text x="484" y="420" font-family="Georgia,'EB Garamond',serif" font-size="11.5" fill="#9b4a3f">no automatic next step, so it waits</text>
<text x="484" y="444" font-family="Georgia,'EB Garamond',serif" font-size="11" font-style="italic" fill="#9b4a3f">this is what most control planes ship by default</text>

<!-- footer: legend + captions -->
<line x1="0" y1="536" x2="880" y2="536" stroke="#1a1a1a" stroke-width="1"/>

<rect x="20" y="552" width="14" height="10" fill="#6b6b6b"/>
<text x="40" y="561" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">ordered level, named owner, acknowledgement window</text>
<rect x="460" y="552" width="14" height="10" fill="#9b4a3f"/>
<text x="480" y="561" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">unowned queue: no owner, no deadline, no next step</text>

<text x="0" y="592" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">A block is not a decision. It is a case waiting for one, and something must own what happens if nobody looks.</text>
<text x="0" y="612" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#6b6b6b">PagerDuty solved this for incidents decades ago: ordered levels, an acknowledgement timeout, automatic escalation. Agent control planes keep skipping it.</text>
</svg>
