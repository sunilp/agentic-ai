<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="'IBM Plex Sans', system-ui, sans-serif">
  <rect width="800" height="480" fill="#ffffff"/>

  <!-- Vertical divider -->
  <line x1="400" y1="40" x2="400" y2="430" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ──── LEFT: LOOKUP ──── -->
  <text x="40" y="50" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#9b4a3f">SURFACE 1</text>
  <text x="40" y="86" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="500" fill="#1a1a1a">Lookup</text>
  <text x="40" y="118" font-family="'IBM Plex Sans', sans-serif" font-size="14" fill="#6b6b6b">A fact lives in one place. The model finds it.</text>

  <!-- Visual: stack of pages, one highlighted -->
  <g transform="translate(60, 150)">
    <rect x="0"  y="0"   width="240" height="14" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <line x1="12" y1="7" x2="100" y2="7" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="0"  y="18"  width="240" height="14" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <line x1="12" y1="25" x2="120" y2="25" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="0"  y="36"  width="240" height="16" fill="#fafaf8" stroke="#9b4a3f" stroke-width="1.5"/>
    <text x="120" y="48" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#9b4a3f">the answer</text>
    <rect x="0"  y="56"  width="240" height="14" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <line x1="12" y1="63" x2="110" y2="63" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="0"  y="74"  width="240" height="14" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <line x1="12" y1="81" x2="130" y2="81" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="0"  y="92"  width="240" height="14" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <line x1="12" y1="99" x2="90"  y2="99" stroke="#e8e8e8" stroke-width="1"/>

    <!-- find arrow -->
    <path d="M -16 44 Q -4 44 0 44" stroke="#9b4a3f" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="-20" cy="44" r="3" fill="none" stroke="#9b4a3f" stroke-width="1.5"/>
  </g>

  <text x="40" y="290" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" letter-spacing="1.5" fill="#6b6b6b">MEASURED BY</text>
  <text x="40" y="316" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#1a1a1a">NIAH · MRCR · Google MRCR</text>
  <text x="40" y="336" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#6b6b6b" font-style="italic">needle-in-haystack recall</text>

  <text x="40" y="392" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.5" fill="#9b4a3f">vendor launch posts publish this</text>


  <!-- ──── RIGHT: SYNTHESIS ──── -->
  <text x="440" y="50" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" letter-spacing="2" fill="#9b4a3f">SURFACE 2</text>
  <text x="440" y="86" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="500" fill="#1a1a1a">Synthesis</text>
  <text x="440" y="118" font-family="'IBM Plex Sans', sans-serif" font-size="14" fill="#6b6b6b">Facts across many places. The model joins them.</text>

  <!-- Visual: 4 page mini-stacks → center join node -->
  <g transform="translate(440, 150)">
    <!-- Mini stack 1 (top-left) -->
    <rect x="0"  y="0"  width="56" height="10" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="0"  y="13" width="56" height="10" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="0"  y="26" width="56" height="12" fill="#fafaf8" stroke="#9b4a3f" stroke-width="1.5"/>
    <!-- Mini stack 2 (bottom-left) -->
    <rect x="0"  y="60" width="56" height="10" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="0"  y="73" width="56" height="12" fill="#fafaf8" stroke="#9b4a3f" stroke-width="1.5"/>
    <rect x="0"  y="88" width="56" height="10" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <!-- Mini stack 3 (top-right) -->
    <rect x="264" y="0"  width="56" height="12" fill="#fafaf8" stroke="#9b4a3f" stroke-width="1.5"/>
    <rect x="264" y="15" width="56" height="10" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="264" y="28" width="56" height="10" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <!-- Mini stack 4 (bottom-right) -->
    <rect x="264" y="60" width="56" height="10" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="264" y="73" width="56" height="10" fill="#fafaf8" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="264" y="86" width="56" height="12" fill="#fafaf8" stroke="#9b4a3f" stroke-width="1.5"/>

    <!-- Curves joining the four needles to center -->
    <path d="M 56 32  C 100 32, 130 48, 144 50" stroke="#9b4a3f" stroke-width="1.2" fill="none"/>
    <path d="M 56 79  C 100 79, 130 64, 144 60" stroke="#9b4a3f" stroke-width="1.2" fill="none"/>
    <path d="M 264 6  C 240 6, 200 44, 192 50"  stroke="#9b4a3f" stroke-width="1.2" fill="none"/>
    <path d="M 264 92 C 240 92, 200 66, 192 60" stroke="#9b4a3f" stroke-width="1.2" fill="none"/>

    <!-- Center join node -->
    <rect x="144" y="40" width="48" height="32" rx="3" fill="#9b4a3f" fill-opacity="0.08" stroke="#9b4a3f" stroke-width="1.5"/>
    <text x="168" y="55" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#9b4a3f">join</text>
    <text x="168" y="67" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#9b4a3f">+ cite</text>
  </g>

  <text x="440" y="290" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" letter-spacing="1.5" fill="#6b6b6b">MEASURED BY</text>
  <text x="440" y="316" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#1a1a1a">NoLiMa · RULER · NoCha · BABILong</text>
  <text x="440" y="336" font-family="'IBM Plex Sans', sans-serif" font-size="12" fill="#6b6b6b" font-style="italic">paraphrase, claim-verify, multi-step</text>

  <text x="440" y="392" font-family="'IBM Plex Mono', monospace" font-size="11" letter-spacing="0.5" fill="#9b4a3f">mostly in the academic literature</text>


  <!-- Bottom caption rule -->
  <line x1="40" y1="430" x2="760" y2="430" stroke="#e8e8e8" stroke-width="1"/>
  <text x="400" y="458" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" fill="#6b6b6b" font-style="italic">Most production workloads mix both. The decision turns on the second one.</text>
</svg>
