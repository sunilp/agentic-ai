<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img" aria-label="Loop Lab's hallucinated-done scenario, run twice. With the capability gate off, delete_all executes and the database ends up deleted. With the gate on, delete_all is blocked and the database stays intact. In both runs the trace ends with the identical line, agent claims the task is complete, shown as one shared brick-colored box that both outcomes converge into with no check placed between either outcome and that claim.">
<rect width="880" height="480" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">The claim does not know what happened to the action</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">Loop Lab's hallucinated-done scenario, run twice. The database ends up different each time. The trace's last line does not.</text>
<line x1="0" y1="70" x2="880" y2="70" stroke="#1a1a1a" stroke-width="1"/>

<!-- ROW A background -->
<rect x="0" y="84" width="620" height="132" fill="#fafaf8"/>
<line x1="0" y1="216" x2="560" y2="216" stroke="#e8e8e8" stroke-width="1"/>

<!-- ROW A: gate off -->
<text x="24" y="146" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#1a1a1a">1</text>
<text x="46" y="140" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="0.8" fill="#1a1a1a">CAPABILITY GATE OFF</text>
<text x="46" y="158" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">delete_all runs</text>

<circle cx="230" cy="150" r="5" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="230" y="172" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">read_rows</text>
<line x1="236" y1="150" x2="344" y2="150" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="350" cy="150" r="6" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="350" y="132" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="9.5" font-style="italic" fill="#6b6b6b">executed</text>
<text x="350" y="172" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">delete_all</text>

<line x1="356" y1="150" x2="440" y2="148" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="440" y="128" width="120" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="500" y="152" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#1a1a1a">DATABASE: DELETED</text>

<!-- ROW B: gate on -->
<text x="24" y="278" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#1a1a1a">2</text>
<text x="46" y="272" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="0.8" fill="#1a1a1a">CAPABILITY GATE ON</text>
<text x="46" y="290" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">delete_all is blocked</text>

<circle cx="230" cy="282" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="230" y="304" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">read_rows</text>
<line x1="236" y1="282" x2="344" y2="282" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="350" cy="282" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="350" y="264" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="9.5" font-style="italic" fill="#6b6b6b">blocked</text>
<text x="350" y="304" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#1a1a1a">delete_all</text>

<line x1="356" y1="282" x2="440" y2="284" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="440" y="262" width="120" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="500" y="286" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#1a1a1a">DATABASE: INTACT</text>

<!-- convergence: two different outcomes, one claim -->
<line x1="560" y1="148" x2="700" y2="205" stroke="#1a1a1a" stroke-width="1.3"/>
<line x1="560" y1="282" x2="700" y2="235" stroke="#1a1a1a" stroke-width="1.3"/>
<text x="630" y="203" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">no check reads</text>
<text x="630" y="217" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">either state</text>

<!-- the shared claim: single accent -->
<text x="780" y="172" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" letter-spacing="0.8" fill="#1a1a1a">THE TRACE'S LAST LINE</text>
<rect x="700" y="185" width="160" height="70" rx="4" fill="#9b4a3f" stroke="#9b4a3f"/>
<text x="780" y="213" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="12" font-style="italic" fill="#fafaf8">agent claims the</text>
<text x="780" y="231" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="12" font-style="italic" fill="#fafaf8">task is complete</text>

<!-- legend -->
<circle cx="28" cy="368" r="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="46" y="372" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">delete_all ran</text>

<circle cx="230" cy="368" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="248" y="372" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">delete_all was blocked</text>

<rect x="460" y="363" width="16" height="10" fill="#9b4a3f"/>
<text x="482" y="372" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">the trace's last line, unchanged either way</text>

<line x1="0" y1="400" x2="880" y2="400" stroke="#1a1a1a" stroke-width="1"/>

<text x="0" y="422" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">The database ends up in two different states depending on the gate. The trace's last line does not.</text>
<text x="0" y="442" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#6b6b6b">Anchor a check to the task at that exact line, and the claim stops being the only witness to what happened.</text>
</svg>
