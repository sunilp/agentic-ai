<svg xmlns="http://www.w3.org/2000/svg" width="880" height="620" viewBox="0 0 880 620" role="img" aria-label="The same five worker outputs, one of them wrong, run through two verifiers. In the top lane, a verifier with no rubric approves all five, including the wrong one, marked in brick: the approval carries no information because it would have been granted either way. In the bottom lane, the same five outputs run through a verifier carrying a checkable rubric, which approves the four correct ones and rejects the one wrong output, catching what the first lane waved through.">
<rect width="880" height="620" fill="#ffffff"/>

<text x="0" y="24" font-family="Georgia,'EB Garamond',serif" font-size="19" fill="#1a1a1a">An approval granted every time carries no information</text>
<text x="0" y="46" font-family="Georgia,'EB Garamond',serif" font-size="13.5" fill="#6b6b6b">The same five outputs, one of them wrong, run through two verifiers. Only one of them can ever say no.</text>
<line x1="0" y1="70" x2="880" y2="70" stroke="#1a1a1a" stroke-width="1"/>

<!-- ============ LANE A: no rubric ============ -->
<text x="24" y="94" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.2" fill="#1a1a1a">NO RUBRIC: RUBBER-STAMP VERIFIER</text>

<text x="24" y="128" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#6b6b6b">OUTPUTS</text>

<!-- row 1: ground truth, five worker outputs, node 3 is the wrong one -->
<circle cx="80" cy="124" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="260" cy="124" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<polygon points="440,115 449,124 440,133 431,124" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="620" cy="124" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="800" cy="124" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>

<!-- converging lines into the verifier box -->
<line x1="80" y1="131" x2="440" y2="150" stroke="#6b6b6b" stroke-width="1"/>
<line x1="260" y1="131" x2="440" y2="150" stroke="#6b6b6b" stroke-width="1"/>
<line x1="440" y1="133" x2="440" y2="150" stroke="#6b6b6b" stroke-width="1"/>
<line x1="620" y1="131" x2="440" y2="150" stroke="#6b6b6b" stroke-width="1"/>
<line x1="800" y1="131" x2="440" y2="150" stroke="#6b6b6b" stroke-width="1"/>

<!-- verifier box, no rubric -->
<rect x="380" y="150" width="120" height="55" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="440" y="175" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1a1a1a">VERIFIER</text>
<text x="440" y="192" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">no rubric</text>

<!-- fan out to verdicts, all approved -->
<line x1="440" y1="205" x2="80" y2="243" stroke="#6b6b6b" stroke-width="1"/>
<line x1="440" y1="205" x2="260" y2="243" stroke="#6b6b6b" stroke-width="1"/>
<line x1="440" y1="205" x2="440" y2="241" stroke="#6b6b6b" stroke-width="1"/>
<line x1="440" y1="205" x2="620" y2="243" stroke="#6b6b6b" stroke-width="1"/>
<line x1="440" y1="205" x2="800" y2="243" stroke="#6b6b6b" stroke-width="1"/>

<!-- verdict marks, row 2 -->
<text x="80" y="240" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">&#10003;</text>
<text x="260" y="240" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">&#10003;</text>
<text x="440" y="240" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#9b4a3f">&#10003;</text>
<text x="620" y="240" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">&#10003;</text>
<text x="800" y="240" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">&#10003;</text>

<circle cx="80" cy="250" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="260" cy="250" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="440" cy="250" r="9" fill="#9b4a3f" stroke="#9b4a3f" stroke-width="1.4"/>
<circle cx="620" cy="250" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="800" cy="250" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>

<text x="24" y="254" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#6b6b6b">VERDICT</text>

<!-- callout: the wrong output, waved through -->
<text x="460" y="254" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#9b4a3f">approved anyway</text>

<line x1="0" y1="290" x2="880" y2="290" stroke="#e8e8e8" stroke-width="1"/>

<!-- ============ LANE B: with a rubric ============ -->
<text x="24" y="314" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.2" fill="#1a1a1a">WITH A RUBRIC: CAN REFUSE</text>

<text x="24" y="348" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#6b6b6b">OUTPUTS</text>

<!-- row 1: the same five outputs, same node 3 wrong -->
<circle cx="80" cy="344" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="260" cy="344" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<polygon points="440,335 449,344 440,353 431,344" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="620" cy="344" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="800" cy="344" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>

<line x1="80" y1="351" x2="440" y2="370" stroke="#6b6b6b" stroke-width="1"/>
<line x1="260" y1="351" x2="440" y2="370" stroke="#6b6b6b" stroke-width="1"/>
<line x1="440" y1="353" x2="440" y2="370" stroke="#6b6b6b" stroke-width="1"/>
<line x1="620" y1="351" x2="440" y2="370" stroke="#6b6b6b" stroke-width="1"/>
<line x1="800" y1="351" x2="440" y2="370" stroke="#6b6b6b" stroke-width="1"/>

<!-- verifier box, with rubric -->
<rect x="380" y="370" width="120" height="55" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="440" y="395" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1a1a1a">VERIFIER</text>
<text x="440" y="412" text-anchor="middle" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">checkable rubric</text>

<line x1="440" y1="425" x2="80" y2="463" stroke="#6b6b6b" stroke-width="1"/>
<line x1="440" y1="425" x2="260" y2="463" stroke="#6b6b6b" stroke-width="1"/>
<line x1="440" y1="425" x2="440" y2="461" stroke="#6b6b6b" stroke-width="1"/>
<line x1="440" y1="425" x2="620" y2="463" stroke="#6b6b6b" stroke-width="1"/>
<line x1="440" y1="425" x2="800" y2="463" stroke="#6b6b6b" stroke-width="1"/>

<text x="80" y="460" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">&#10003;</text>
<text x="260" y="460" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">&#10003;</text>
<text x="440" y="460" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#6b6b6b">&#10007;</text>
<text x="620" y="460" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">&#10003;</text>
<text x="800" y="460" text-anchor="middle" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">&#10003;</text>

<circle cx="80" cy="470" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="260" cy="470" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="440" cy="470" r="7" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="2,2"/>
<circle cx="620" cy="470" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<circle cx="800" cy="470" r="7" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>

<text x="24" y="474" font-family="'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace" font-size="9.5" fill="#6b6b6b">VERDICT</text>

<!-- callout: the same wrong output, this time caught -->
<text x="460" y="474" font-family="Georgia,'EB Garamond',serif" font-size="10.5" font-style="italic" fill="#6b6b6b">caught this time</text>

<line x1="0" y1="500" x2="880" y2="500" stroke="#e8e8e8" stroke-width="1"/>

<!-- legend -->
<circle cx="28" cy="522" r="6" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="44" y="526" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">a correct output</text>

<polygon points="232,515 239,522 232,529 225,522" fill="#fafaf8" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="248" y="526" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">a wrong output</text>

<circle cx="416" cy="522" r="6" fill="#ffffff" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="2,2"/>
<text x="432" y="526" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">rejected, correctly</text>

<circle cx="610" cy="522" r="7" fill="#9b4a3f" stroke="#9b4a3f" stroke-width="1.4"/>
<text x="627" y="526" font-family="Georgia,'EB Garamond',serif" font-size="12" fill="#1a1a1a">wrong, approved anyway</text>

<line x1="0" y1="548" x2="880" y2="548" stroke="#1a1a1a" stroke-width="1"/>

<text x="0" y="572" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#1a1a1a">An approval that is granted no matter what was produced tells you nothing about what was produced.</text>
<text x="0" y="592" font-family="Georgia,'EB Garamond',serif" font-size="12.5" fill="#6b6b6b">The rubric is what lets the second verifier tell the two apart; the first can only ever say yes.</text>
</svg>
